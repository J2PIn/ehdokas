<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>ehdokas.site — Avoimuusindeksi</title>
    <meta
      name="description"
      content="Ehdokkaiden avoimuus ennen vaalipäivää. Vain julkiset linkit, ei tallennusta."
    />

    <!-- Social preview -->
    <meta property="og:title" content="ehdokas.site — Avoimuusindeksi" />
    <meta
      property="og:description"
      content="Kuka julkaisee avoimuusdokumentit ennen vaalipäivää? Vain julkiset linkit, ei tallennusta."
    />
    <meta property="og:url" content="https://ehdokas.site/" />
    <!-- optional: add your own OG image later -->
    <!-- <meta property="og:image" content="https://ehdokas.site/assets/og.png" /> -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Sortino stack: Tailwind CDN + Inter -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
            boxShadow: { soft: "0 10px 30px rgba(15, 23, 42, 0.08)" },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Sortino marquee helper (used by ticker) -->
    <style>
      @keyframes marquee {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .marquee {
        animation: marquee 240s linear infinite;
        will-change: transform;
      }
      .marquee:hover {
        animation-play-state: paused;
      }
      @media (prefers-reduced-motion: reduce) {
        .marquee {
          animation: none !important;
          transform: none !important;
        }
      }
    </style>
  </head>

  <!-- Cookie / privacy notice -->
  <div id="cookieNotice"
    class="fixed inset-x-0 bottom-0 z-50 hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Cookie notice">
    <div class="mx-auto max-w-6xl px-4 pb-4">
      <div class="rounded-2xl border border-slate-200 bg-white/95 backdrop-blur shadow-lg">
        <div class="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between">
          <div class="text-sm text-slate-700">
            <p class="font-semibold text-slate-900">Cookie notice</p>
            <p class="mt-1">
              Ehdokas.site ei käytä analysointi- eikä mainostusevästeitä. Tallennamme ainoastaan tiedon siitä, että suljit tämän tiedoksiannon.
            </p>
  
            <!-- Optional: hide if you don't have a privacy page -->
            <button id="cookieLearnMore"
              class="mt-2 inline-flex items-center gap-1 text-sm font-medium text-slate-900 underline decoration-slate-300 underline-offset-4 hover:decoration-slate-500">
              Learn more
            </button>
          </div>
  
          <div class="flex gap-2">
            <button id="cookieAccept"
              class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400">
              OK
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <body class="font-sans text-slate-900">
    <!-- Sortino “premium light background” -->
    <div class="fixed inset-0 -z-10">
      <div class="absolute inset-0 bg-[#fbfcff]"></div>
      <div
        class="absolute -top-32 left-1/2 h-[28rem] w-[52rem] -translate-x-1/2 rounded-full bg-cyan-200/40 blur-3xl"
      ></div>
      <div
        class="absolute top-40 left-1/4 h-[26rem] w-[40rem] rounded-full bg-indigo-200/35 blur-3xl"
      ></div>
      <div
        class="absolute top-[30rem] right-0 h-[26rem] w-[40rem] rounded-full bg-amber-200/25 blur-3xl"
      ></div>
    </div>

    <!-- Vite mount point -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
